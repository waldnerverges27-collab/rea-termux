[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-termux"
version = "0.1.0"
description = "Agente CLI para Termux: analiza APKs con el MCP de REA y genera una reimplementacion propia usando un proveedor compatible con OpenAI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rea-termux" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]
freeze = ["pyinstaller>=6.20,<7"]

[project.scripts]
rea-termux = "rea_termux.cli:main"

[tool.setuptools]
packages = ["rea_termux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
